name: Desktop checks
on:
  pull_request:
  push:
    branches: [main, master, "codex/**"]
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            requirements: packaging/tauri/requirements-macos.lock
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            requirements: packaging/windows/requirements.lock
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: >-
          uv pip install --python python --require-hashes --no-deps --only-binary :all: -r ${{ matrix.requirements }}
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - run: python -m unittest discover -s desktop/tests/python -v
      - run: python packaging/tauri/prepare_payload.py --target ${{ matrix.target }}
      - run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
        working-directory: desktop
