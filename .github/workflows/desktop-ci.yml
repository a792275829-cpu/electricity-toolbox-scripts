name: Desktop checks
on:
  pull_request:
  push:
    branches: [main, master, "codex/**"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to check
        required: true
        default: windows
        type: choice
        options: [windows, macos, both]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: platforms
        env:
          CHECK_PLATFORM: ${{ inputs.platform || 'windows' }}
        run: python packaging/tauri/release_index.py --plan "$CHECK_PLATFORM" --github-output "$GITHUB_OUTPUT"
  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: >-
          uv pip install --python python --require-hashes --no-deps --only-binary :all: -r ${{ matrix.requirements }}
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - run: python -m unittest discover -s desktop/tests/python -v
      - run: python packaging/tauri/prepare_payload.py --target ${{ matrix.target }}
      - run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
        working-directory: desktop
