name: Desktop release
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths: [desktop/package.json]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string
      platform:
        description: Platform to release (this maintenance environment defaults to Windows)
        required: true
        default: windows
        type: choice
        options: [windows, macos, both]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.draft.outputs.release }}
      matrix: ${{ steps.platforms.outputs.matrix }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python packaging/tauri/version.py check --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          else
            python packaging/tauri/version.py check --github-output "$GITHUB_OUTPUT"
          fi
      - id: platforms
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'windows' }}
        run: >-
          python packaging/tauri/release_index.py --plan "$RELEASE_PLATFORM"
          --github-output "$GITHUB_OUTPUT" --notes-file packaging/tauri/release_notes.md
          --notes-output release-notes-selected.md
      - name: Create version tag for a main-branch release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > tag.json 2>/dev/null; then
            python -c 'import json,os; assert json.load(open("tag.json"))["object"]["sha"] == os.environ["GITHUB_SHA"], "Version tag already points to a different commit"'
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "电力工具箱 $RELEASE_TAG" --notes-file release-notes-selected.md
          elif [ "$(cat draft-state.txt)" != "true" ]; then
            echo 'Refusing to replace an already published release.' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json databaseId --jq '"release=" + (.databaseId|tostring)' >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: >-
          uv pip install --python python --require-hashes --no-deps --only-binary :all: -r ${{ matrix.requirements }}
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python -m unittest discover -s desktop/tests/python -v
      - run: python packaging/tauri/prepare_payload.py --target ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Generate and validate selected platform updater index
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: python packaging/tauri/release_index.py "$RELEASE_TAG" --platforms "$RELEASE_PLATFORMS"
      - name: Publish only after selected platforms succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
