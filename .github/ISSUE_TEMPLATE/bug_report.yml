name: 问题报告
description: 报告可复现的错误
labels: []
body:
  - type: markdown
    attributes:
      value: 安全漏洞请使用仓库的私人漏洞报告入口。请勿填写账号、Cookie、登录态或真实业务数据。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 操作…\n3. 出现…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境和版本
      description: macOS 版本、工具箱版本，以及安装版或源码版。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志或其他信息
      render: text
