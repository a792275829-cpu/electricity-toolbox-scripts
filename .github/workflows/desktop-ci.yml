name: Desktop checks
on:
  pull_request:
  push:
    branches: [main, master, "codex/**"]
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            requirements: packaging/tauri/requirements-macos.lock
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 packaging/tauri/version.py check --require-notes
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: >-
          uv pip install --python python --require-hashes --no-deps --only-binary :all: -r ${{ matrix.requirements }}
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run web:build
        working-directory: desktop
      - run: python native/price-xlsx/build.py
      - run: TOOLBOX_XLSX_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_native_excel.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_XLSX_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_summary_station_folder.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_XLSX_BACKEND=rust TOOLBOX_COMPUTE_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_remaining_native.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_XLSX_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_native_updates.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_XLSX_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_all_trial_optimizations.py -v
        working-directory: 电力工具箱
      - run: PYTHONPATH=.. python -m unittest discover -s tests -p test_workbook_inspection.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_XLSX_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_power_benefit_update.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_XLSX_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_transaction_info_update.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_COMPUTE_BACKEND=rust PYTHONPATH=.. python -m unittest discover -s tests -p test_daily_pdf_parser.py -v
        working-directory: 电力工具箱
      - run: TOOLBOX_500KV_BACKEND=rust python -m unittest discover -s tests -v
        working-directory: 500kV断面分析
      - run: python -m unittest discover -s desktop/tests/python -v
      - run: PYTHONPATH=.. python -m unittest discover -s tests -p test_tasks.py -v
        working-directory: 电力工具箱
      - name: Create synthetic forecast workbook for CI smoke build
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook
          Path("dist").mkdir(exist_ok=True)
          book = Workbook()
          sheet = book.active
          sheet.title = "整合数据"
          sheet.append(["日期", "时刻", "全省日前平均电价"])
          sheet.append(["2026-01-01", "00:00", 0.0])
          book.save("dist/ci-forecast.xlsx")
          book.close()
          PY
      - run: python packaging/tauri/prepare_payload.py --target ${{ matrix.target }} --forecast-workbook dist/ci-forecast.xlsx
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}
        working-directory: desktop
