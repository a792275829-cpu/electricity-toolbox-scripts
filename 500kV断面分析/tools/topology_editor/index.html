<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 / 220kV 接线图标注</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><strong>接线图标注</strong><span class="sub">500 / 220kV · 本机保存</span></div><nav>
<button id="importMap">导入底图</button><button id="importPrices">导入电价表</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="save" class="primary">保存草稿</button><details class="more"><summary>备份与加载</summary><div><button id="export">导出备份</button><button id="importJson">导入备份</button><button id="reload">加载已保存</button></div></details>
</nav></header>
<div class="steps" aria-label="编辑步骤"><button id="stepMap">① 标注站点</button><button id="stepReview">② 核对连接</button><button id="stepDiagram">③ 生成简图</button><span id="progress"></span><button id="apply" class="primary">应用到分析</button></div>
<div id="notice" role="status">正在读取节点库…</div>
<main><aside id="library"><h2>节点库</h2><input id="search" type="search" aria-label="搜索节点" placeholder="搜索站名…"><select id="filter" aria-label="筛选节点"><option value="unmarked">未标注</option><option value="all">全部节点</option><option value="marked">已标注</option><option value="unplaced">简图未入图</option><option value="missing">本次缺失</option><option value="pending">待确认价格</option></select><div id="nodeList"></div><div id="annotationTools"><label><input id="continuous" type="checkbox" checked>连续标注，完成后选择下一站</label><button id="skip">跳过，下一站</button><button id="clearMark">取消所选站点标注</button></div><button id="place">将所选节点放入图中</button><details><summary>节点清理</summary><button id="cleanMissing" class="danger" disabled>清理缺失节点</button></details></aside>
<section id="drawing"><div class="tools"><button id="selectMode" aria-pressed="true">选择 / 拖动</button><button id="connectMode" aria-pressed="false">新增连接</button><button id="cancelMode" disabled>取消连线</button><button id="nextReview">下一条待核对</button><button id="resetLayout">按底图重新排版</button><span class="spacer"></span><button id="zoomOut" aria-label="缩小">−</button><output id="zoomValue">100%</output><button id="zoomIn" aria-label="放大">＋</button><button id="fit">全图</button><button id="locate">放大所选</button></div>
<div class="layers"><label><input type="checkbox" id="v500" checked>500kV</label><label><input type="checkbox" id="v220" checked>220kV</label><label><input type="checkbox" id="vNone" checked>待确认</label><span>捏合缩放 · 双指滑动平移 · 拖动空白平移</span></div>
<div id="mapEmpty" hidden>先导入接线图 PDF 或图片，再从左侧选站名、在底图点选位置。已有布局可在“生成简图”中查看。</div>
<svg id="canvas" tabindex="0" aria-label="可缩放的接线图"><g id="view"><image id="baseImage" preserveAspectRatio="none"></image><g id="edges"></g><g id="nodes"></g><g id="preview"></g></g></svg></section>
<aside id="inspector"><div class="inspectorTitle"><h2>站点与连接</h2><button id="closeInspector" aria-label="收起属性">×</button></div><p id="selection">选择节点或线路</p><section id="nodeForm" hidden><label>显示名称<input id="name" maxlength="200"></label><label>电压<select id="voltage"><option value="500">500kV</option><option value="220">220kV</option><option value="">待确认</option></select></label><label>所属地市<input id="city" maxlength="100"></label><button id="updateNode">更新属性</button><button id="comparePrices" disabled>对比同站价格</button><button id="startConnection">从此节点连线</button><h3>相连节点 · 逐条核对</h3><div id="connections"></div><section id="variant" hidden><h3>多价格对应</h3><select id="oldNode" aria-label="对应的旧节点"></select><button id="resolveOld">对应此旧节点</button><button id="resolveNew">确认为独立新增节点</button></section></section><section id="edgeForm" hidden><p id="edgeReviewStatus"></p><label>连接类型<select id="edgeKind"><option value="line">站间线路</option><option value="transformer">站内变压器</option></select></label><button id="reviewEdge" class="primary">核对并确认此连接</button><button id="unreviewEdge">撤回确认</button><button id="updateEdge">更新线路类型</button></section><button id="delete" class="danger" disabled>删除所选节点 / 线路</button></aside></main>
<footer id="summary"></footer>
<dialog id="connectionDialog"><form method="dialog"><h2 id="connectionTitle">确认新增连接</h2><p id="connectionFrom"></p><p id="connectionTo"></p><label>连接类型<select id="connectionKind"><option value="line">站间线路</option><option value="transformer">站内变压器</option></select></label><p id="connectionHint">点击确认才保存连接，取消不会修改拓扑。</p><div class="dialogActions"><button value="cancel">取消</button><button id="confirmConnection" type="button" class="primary">确认连接</button></div></form></dialog>
<dialog id="pricesDialog"><form method="dialog"><h2>同站价格对比</h2><p>同站同电压的曲线逐时对比，差异以底色标出；“—”表示该时点无价格。</p><div class="tableScroll"><table id="pricesTable"></table></div><div class="dialogActions"><button>关闭</button></div></form></dialog>
<input id="mapFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden><input id="pricesFile" type="file" accept=".xlsx" hidden><input id="jsonFile" type="file" accept=".json" hidden>
</body></html>
