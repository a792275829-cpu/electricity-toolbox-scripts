<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500／220kV 节点校对</title><link rel="stylesheet" href="/styles.css"></head><body>
<aside><h1>分层拓扑 · 节点校对</h1><p id="summary">正在加载…</p><input id="search" placeholder="搜索名称、候选电价或分片"><select id="filter"><option value="all">全部节点</option><option value="mapping">映射待核验</option><option value="position">坐标待定位</option><option value="confirmed">映射已确认</option></select><div id="list"></div></aside>
<main><header><strong id="title">选择节点</strong><span id="message"></span><button id="fit" type="button">适应底图</button><button id="save" type="button">保存本项</button></header><div class="body"><div id="viewer"><div id="stage"><img src="/image.png" draggable="false" alt="接线图"><svg id="overlay" viewBox="0 0 7111 5025"></svg></div><div class="hint">滚轮缩放 · 拖动平移 · 点击图面设置坐标（保存后生效）</div></div><section><label>规范名称<input id="name"></label><label>电压等级<select id="voltage"><option>待核验</option><option>500kV</option><option>220kV</option><option>其他</option></select></label><label>电价原始名称（逐行填写）<textarea id="mapping" rows="4"></textarea></label><label>映射状态<select id="mapping_status"><option>待核验</option><option>已确认</option><option>无匹配</option><option>排除</option></select></label><label>坐标状态<select id="position_status"><option>待定位</option><option>候选</option><option>已确认</option></select></label><p id="coordinates"></p><button id="clear" type="button">清除坐标</button><label>备注<textarea id="note" rows="3"></textarea></label><h3>来源候选（均待核验）</h3><pre id="candidates"></pre><p>保存的记录是人工校对底稿，尚未接入价格曲线或断面分析。名称与电压须逐项核实，线路候选不是母线价格。</p></section></div></main><script src="/store.js"></script><script src="/app.js"></script></body></html>
