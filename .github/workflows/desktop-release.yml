name: Desktop release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
        type: string
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.draft.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python packaging/tauri/version.py check --tag "$RELEASE_TAG" --require-notes --release-notes release-notes.md --github-output "$GITHUB_OUTPUT"
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "电力工具箱 $RELEASE_TAG" --notes-file release-notes.md
          elif [ "$(cat draft-state.txt)" != "true" ]; then
            echo 'Refusing to replace an already published release.' >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json databaseId --jq '"release=" + (.databaseId|tostring)' >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            requirements: packaging/tauri/requirements-macos.lock
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11.15"
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: >-
          uv pip install --python python --require-hashes --no-deps --only-binary :all: -r ${{ matrix.requirements }}
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: python -m unittest discover -s desktop/tests/python -v
      - run: python packaging/tauri/prepare_payload.py --target ${{ matrix.target }}
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - name: Build application for DMG
        working-directory: desktop
        run: npm run build -- --target ${{ matrix.target }} --bundles app
      - name: Build and upload user-install DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python packaging/tauri/build_dmg.py desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/电力工具箱.app --output dist
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.dmg.sha256 --clobber
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Validate installer metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          python packaging/tauri/validate_installer.py release.json
      - name: Publish only after the macOS build succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
