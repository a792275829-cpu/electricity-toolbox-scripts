<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>500 / 220kV 拓扑编辑</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><strong>拓扑编辑</strong><span class="sub">500 / 220kV · 本机保存</span></div><nav>
<button id="importPrices">导入电价表</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="save">保存草稿</button><button id="apply" class="primary">应用到分析</button><button id="export">导出备份</button><button id="importJson">导入备份</button><button id="reload">加载已保存</button>
</nav></header>
<div id="notice" role="status">正在读取节点库…</div>
<main><aside id="library"><h2>节点库</h2><input id="search" type="search" aria-label="搜索节点" placeholder="搜索站名…"><select id="filter" aria-label="筛选节点"><option value="all">全部节点</option><option value="unplaced">未入图</option><option value="missing">本次缺失</option><option value="pending">待确认</option></select><div id="nodeList"></div><button id="place">将所选节点放入图中</button></aside>
<section id="drawing"><div class="tools"><button id="selectMode" aria-pressed="true">选择 / 拖动</button><button id="connectMode" aria-pressed="false">新增连接</button><button id="cancelMode" disabled>取消连线</button><span class="spacer"></span><button id="zoomOut" aria-label="缩小">−</button><output id="zoomValue">100%</output><button id="zoomIn" aria-label="放大">＋</button><button id="fit">全图</button><button id="locate">放大所选</button></div>
<div class="layers"><label><input type="checkbox" id="v500" checked>500kV</label><label><input type="checkbox" id="v220" checked>220kV</label><label><input type="checkbox" id="vNone" checked>待确认</label><span>双指捏合缩放 · 双指滑动平移 · 拖动空白平移</span></div>
<svg id="canvas" tabindex="0" aria-label="可缩放的接线图"><g id="view"><g id="edges"></g><g id="nodes"></g><g id="preview"></g></g></svg></section>
<aside id="inspector"><h2>属性</h2><p id="selection">选择节点或线路</p><section id="nodeForm" hidden><label>显示名称<input id="name" maxlength="200"></label><label>电压<select id="voltage"><option value="500">500kV</option><option value="220">220kV</option><option value="">待确认</option></select></label><label>所属地市<input id="city" maxlength="100"></label><button id="updateNode">更新属性</button><button id="startConnection">从此节点连线</button><h3>相连节点</h3><div id="connections"></div><section id="variant" hidden><h3>多价格对应</h3><select id="oldNode" aria-label="对应的旧节点"></select><button id="resolveOld">对应此旧节点</button><button id="resolveNew">确认为独立新增节点</button></section></section><section id="edgeForm" hidden><label>连接类型<select id="edgeKind"><option value="line">站间线路</option><option value="transformer">站内变压器</option></select></label><button id="updateEdge">更新线路类型</button></section><button id="delete" class="danger" disabled>删除所选节点 / 线路</button></aside></main>
<footer id="summary"></footer>
<dialog id="connectionDialog"><form method="dialog"><h2>确认新增连接</h2><p id="connectionFrom"></p><p id="connectionTo"></p><label>连接类型<select id="connectionKind"><option value="line">站间线路</option><option value="transformer">站内变压器</option></select></label><p id="connectionHint">点击确认才新增线路，取消不会修改拓扑。</p><div class="dialogActions"><button value="cancel">取消</button><button id="confirmConnection" type="button" class="primary">确认连接</button></div></form></dialog>
<input id="pricesFile" type="file" accept=".xlsx" hidden><input id="jsonFile" type="file" accept=".json" hidden>
</body></html>
